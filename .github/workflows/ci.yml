name: Basket Analysis CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      - name: Lint with flake8 / Check syntax
        run: |
          python -m pip install flake8
          # Arrête le build s'il y a des erreurs de syntaxe Python
          flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '18'
      - name: Install dependencies & Build
        run: |
          cd frontend
          npm ci
          npm run build